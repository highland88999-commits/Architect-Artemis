- name: Ping Artemis Core (Vercel API)
        run: |
          echo "Initiating synaptic ping to Artemis Core..."
          
          # 1. Validate Secrets
          if [ -z "${{ secrets.ARTEMIS_DOMAIN }}" ]; then
            echo "❌ ERROR: ARTEMIS_DOMAIN secret is missing."
            exit 1
          fi
          
          # 2. Execute Ping with Timeout and Debugging
          # -f fails on HTTP errors, --retry 3 attempts to reconnect if the connection drops
          HTTP_RESPONSE=$(curl -s -o response.txt -w "%{http_code}" \
            --retry 3 \
            --max-time 30 \
            -X POST "https://${{ secrets.ARTEMIS_DOMAIN }}/api/cron" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          
          # 3. Handle Result
          echo "Response code received: $HTTP_RESPONSE"
          if [ "$HTTP_RESPONSE" -ne 200 ]; then
            echo "❌ Engine execution failed. HTTP Status: $HTTP_RESPONSE"
            echo "--- RESPONSE BODY ---"
            cat response.txt
            exit 1
          else
            echo "✅ Engine execution successful."
          fi
